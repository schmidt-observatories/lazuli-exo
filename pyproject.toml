[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lazuli-exo"
dynamic = ["version"]
description = "Lazuli IFS exoplanet transmission spectroscopy simulator (lookup-table runtime)"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Gudmundur Stefansson", email = "gstefansson@schmidtsciences.org" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]   # np.trapezoid
keywords = ["exoplanets", "transmission spectroscopy", "exposure time calculator", "Lazuli", "integral field spectrograph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://github.com/schmidt-observatories/lazuli-exo"
Repository = "https://github.com/schmidt-observatories/lazuli-exo"
Issues = "https://github.com/schmidt-observatories/lazuli-exo/issues"
Changelog = "https://github.com/schmidt-observatories/lazuli-exo/blob/main/docs/sphinx/changelog.rst"

[project.optional-dependencies]
plot = ["matplotlib"]
# lazuli_exo.transit: jaxoplanet-backed TransitModel and the Exoplanet Archive
# cache. The subpackage imports with numpy only; these are what its models need.
transit = ["astropy", "pandas", "jaxoplanet"]
archive = ["astroquery"]
test = ["pytest"]
web = ["flask"]
# Building the docs also needs a pandoc binary on the build machine
# (conda install pandoc / brew install pandoc) for nbsphinx.
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "nbsphinx>=0.9",
    "ipykernel",
    "matplotlib",
    "myst-parser",
]

[tool.setuptools.dynamic]
version = { attr = "lazuli_exo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lazuli_exo = ["data/tables/index.json", "data/tables/*/*.npz"]
