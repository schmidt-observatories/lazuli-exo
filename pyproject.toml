[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "terminator"
version = "0.1.0"
description = "Lazuli IFS exoplanet transmission spectroscopy simulator (lookup-table runtime)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest"]
web = ["flask"]
# Building the docs also needs a pandoc binary on the build machine
# (conda install pandoc / brew install pandoc) for nbsphinx.
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "nbsphinx>=0.9",
    "ipykernel",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terminator = ["data/tables/index.json", "data/tables/*/*.npz"]
